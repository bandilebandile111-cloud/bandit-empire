<!DOCTYPE html>
<html lang="en">
    <head>
	    <meta charset="UTF-8">
	    <title>Retsales.sa</title>
	<style>
	    body {
			margin: 0;
			min-height: 100vh;
			position: relative;
			overflow-x: hidden;
			font-family: Arial, sans-serif;
         }

           
		body::before {
			content: "";
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-image: url('clothes2.jpeg');
			background-position: center;
			background-size: cover;
			background-repeat: no-repeat;
			filter: blur(8px); /* Change this number for more or less blur */
			transform: scale(1.02); /* Hides white fuzzy edges caused by the blur */
			z-index: -1; /* Pushes the background behind everything else */
		}
		.page-container{
		    display: grid;
			grid-template-columns: 1fr 1fr 1fr;
			gap: 25px;
			width: 90%;
			max-width: 1400px;
			margin: 40px auto;
		}
		.column{
		    display: flex;
            flex-direction: column;
            gap: 20px; /* Space between the two items in each column */
		}
		.card p{
		    color: white;
            font-size: 130%;
            margin: 0 0 8px 0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
		}
		.card{
		    text-align: center;
			display: flex;
            flex-direction: column;
            align-items: center;
		}
		.card img{
		    width: 100%;
			height: 40vh;
			object-fit: cover;
			border-radius: 8px;
			display: block;
		}
		.order-btn{
            margin-top: 10px;
            padding: 10px 18px;
            background-color: #25D366;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
		.order-btn:hover{
            background-color: #1ebc59;
            transform: scale(1.03);
        }
		
			
	</style>
	</head>
	<body>
	<div class="page-container">
	    <div class="column">
			<div class="card">
				<p style="color:white; font-size: 150%; margin: 0 0 10px 0;"><strong>Get Your Tops Men</strong></p>
				<img src="topsmen.jpeg" alt="Tops">
				<button class="order-btn" data-product="Men's Tops">Order on WhatsApp</button>
            </div>
			<div class="card">
				<p style="color:white; font-size: 150%; margin: 0 0 10px 0;"><strong>Get Your Tops Women</strong></p>
				<img src="topsLadies.jpeg" alt="Tops">
				<button class="order-btn" data-product="Women's Tops">Order on WhatsApp</button>
			</div>
		</div>
	<div class="column">
	    <div class="card">
			<p style="color:white; font-size: 150%; margin: 0 0 10px 0;"><strong>Get Your Bottoms Men</strong></p>
			<img class="right-img" src="jeans.jpeg" alt="Tops">
			<button class="order-btn" data-product="Men's Bottoms">Order on WhatsApp</button>
        </div>
		<div class="card">
			<p style="color:white; font-size: 150%; margin: 0 0 10px 0;"><strong>Get Your Bottoms Women</strong></p>
			<img class="right-img" src="ladiesbottoms.jpeg" alt="Tops">
			<button class="order-btn" data-product="Women's Bottoms">Order on WhatsApp</button>
		</div>
	</div>
	<div class="column">
         <div class="card">	
			<p style="color:white;font-size:150%;margin: 0 0 10px 0;"><strong>Get Your Collection</strong></p>
			<img src="pile2.jpeg" alt="Description of the image" style="width: 100%; height: 40vh; display: block;">
			<button class="order-btn" data-product="Collection">Order on WhatsApp</button>
		</div>
		<div class="card">
			<p style="color:white;font-size:150%;margin: 0 0 10px 0;"><strong>Get Your Shoes</p></strong>
			<img src="shoes.jpeg" alt="Description of the image" style="width: 100%; height: 40vh; display: block;">
			<button class="order-btn" data-product="Shoes">Order on WhatsApp</button>
        </div>
       </div>
     </div>	
	
	<script>
        const phoneNumber = "27848711675"; // Replace with your WhatsApp number (no + sign)

		 document.querySelectorAll('.order-btn').forEach(button => {
			button.addEventListener('click', (e) => {
			  const product = e.target.getAttribute('data-product');
			  const message = encodeURIComponent(`Hi! I'm interested in ordering the ${product} from Retsales.sa.`);
			  window.open(`https://wa.me/${phoneNumber}?text=${message}`, '_blank');
            });
        });
</script>

	</body>
</html>
